name: Venkat AGI iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build iOS App
        run: |
          xcodebuild \
            -project VenkatAGI.xcodeproj \
            -scheme VenkatAGI \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Verify Build
        run: |
          ls -la build/Build/Products/Debug-iphoneos/
          test -d build/Build/Products/Debug-iphoneos/VenkatAGI.app

      - name: Package iOS App
        run: |
          cd build/Build/Products/Debug-iphoneos
          zip -r "$GITHUB_WORKSPACE/VenkatAGI-iOS-Debug.zip" VenkatAGI.app

      - name: Upload iOS Build
        uses: actions/upload-artifact@v4
        with:
          name: VenkatAGI-iOS-Debug
          path: VenkatAGI-iOS-Debug.zip
          retention-days: 14
